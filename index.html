<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Тайна перепутанных сказок — Ожившее слово</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#072f39;color:#fff5da}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff;outline-offset:3px}button:disabled{opacity:.48;cursor:default}#app{min-height:100vh;background:radial-gradient(ellipse at top,#206574,#083943 60%,#07262e);padding:14px clamp(12px,3vw,42px) 24px}header{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid #e4b95b70;padding-bottom:12px}.brand{font-size:clamp(17px,2vw,26px);font-weight:800;color:#ffe4a0}.progress{display:flex;gap:6px}.gem{width:28px;height:28px;border:2px solid #b89d67;transform:rotate(45deg);border-radius:7px;margin:3px 5px;background:#0a414a;color:transparent}.gem.on{background:linear-gradient(135deg,#fff3ac,#dca43c);box-shadow:0 0 16px #ffe8a8;animation:pop .35s ease-out}.controls{display:flex;flex-wrap:wrap;gap:6px}button.small{font-size:14px;background:#164d57;border:1px solid #d8b66b;border-radius:9px;color:#fff5db;padding:9px 12px}.primary{border:1px solid #f9d980;border-radius:14px;background:linear-gradient(#fff1b1,#efbd55);color:#543500;box-shadow:0 4px 0 #9f6e22;font-weight:800;padding:13px 24px;font-size:clamp(17px,2vw,24px)}.secondary{border:1px solid #cdb675;border-radius:12px;background:#194e58;color:#fff5da;padding:12px 20px;font-weight:bold}.primary:active,.secondary:active{transform:translateY(2px)}main{max-width:1380px;margin:0 auto}h1{margin:12px 0 4px;text-align:center;font-size:clamp(25px,3.3vw,42px);color:#ffe8a4}h2{font-size:clamp(19px,2.2vw,28px);margin:8px 0;color:#ffe8a4}.sub{text-align:center;font-size:clamp(16px,1.8vw,22px);line-height:1.35;margin:5px 0 14px}.splash{position:relative;margin:16px auto 0;max-width:1200px;border:2px solid #e9bd62;border-radius:22px;overflow:hidden}.splash img{width:100%;display:block;max-height:68vh;object-fit:contain;background:#0b3339}.homebuttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:17px 0}.intro{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:center;margin:22px 0}.intro img,.scene img{width:100%;border:2px solid #e4be62;border-radius:20px;display:block}.intro p{font-size:clamp(17px,2vw,26px);line-height:1.45}.books{display:grid;grid-template-columns:1fr 1fr;gap:20px}.book{background:#164c58;border:2px solid #e3b85f;border-radius:16px;padding:8px;color:#fff6dc;position:relative;text-align:center}.book img{width:100%;height:clamp(115px,25vh,255px);object-fit:cover;border-radius:10px;display:block}.book strong{display:block;font-size:clamp(20px,2.5vw,32px);margin:7px}.book.active{box-shadow:0 0 22px #ffe28a}.book .count{position:absolute;top:14px;right:14px;background:#fff0b1;color:#573e0a;border-radius:100px;padding:6px 12px;font-weight:bold}.deck{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0}.tile{background:linear-gradient(#e9f3da,#bcd7bc);border:3px solid #e2b45b;color:#173e3e;border-radius:13px;padding:5px;width:clamp(85px,11vw,150px);font-size:clamp(12px,1.4vw,19px);font-weight:700;overflow:hidden;transition:transform .18s}.tile img{width:100%;height:clamp(78px,15vh,160px);object-fit:contain;display:block;border-radius:8px;pointer-events:none}.tile:hover,.tile.selected{border-color:#fff3ac;box-shadow:0 0 0 3px #f6d264,0 0 16px #ffdc7f;transform:translateY(-3px)}.tile.placed{opacity:.5}.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}.slot{border:2px dashed #e8c878;border-radius:14px;width:clamp(95px,15vw,190px);min-height:110px;background:#08363f;color:#ffe6a5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px;position:relative;font-size:25px;font-weight:bold}.slot img{width:100%;height:clamp(75px,17vh,170px);object-fit:contain;border-radius:8px}.slot span{font-size:14px}.scene{max-width:850px;margin:12px auto;text-align:center}.scene img{max-height:48vh;object-fit:contain;background:#0a333a}.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}.choice{width:clamp(138px,29vw,340px);border:3px solid #d6b15b;background:#e7efd7;color:#173e3e;border-radius:14px;font-size:clamp(16px,1.8vw,22px);font-weight:bold;padding:8px}.choice img{width:100%;height:clamp(100px,25vh,220px);object-fit:contain;border-radius:8px;display:block}.feedback{margin:12px auto;max-width:1100px;border-radius:14px;padding:12px 18px;text-align:center;min-height:58px;background:#123f47;border:1px solid #b89a5e;font-size:clamp(16px,1.9vw,23px);line-height:1.35}.feedback.good{background:#175a42;border-color:#c8db9d}.feedback.bad{background:#624d36;border-color:#f4d394}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px auto}.stage{position:relative;max-width:950px;margin:12px auto;border:5px solid #d3aa53;border-radius:20px;overflow:hidden;background:#092f37}.stage img{width:100%;max-height:44vh;object-fit:contain;display:block}.stage:before,.stage:after{content:'';position:absolute;width:9%;height:100%;top:0;background:repeating-linear-gradient(90deg,#660d29,#b12840 28%,#6d1228 50%);z-index:1;box-shadow:0 0 12px #0006}.stage:after{right:0}.stage:before{left:0}.rolecards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.role{border:1px solid #d5ad64;background:#124c55;border-radius:14px;padding:14px;line-height:1.45;font-size:clamp(15px,1.6vw,20px)}.role strong{display:block;color:#ffe5a0;margin-bottom:6px}.teacher{max-width:1040px;margin:10px auto;padding:10px 16px;color:#d7e7df;font-size:15px;border-left:3px solid #d6b45e;background:#123b43}.teacher summary{cursor:pointer;font-weight:bold}.shine{animation:glow 1.3s ease-in-out infinite alternate}.reward{max-width:1100px;margin:16px auto;position:relative;text-align:center}.reward img{width:100%;max-height:57vh;object-fit:contain;border:2px solid #f0c868;border-radius:20px;display:block}.reward .biggem{width:80px;height:80px;background:linear-gradient(135deg,#fffde2,#ffcc5b,#b47c1c);border-radius:17px;border:4px solid #ffe49b;transform:rotate(45deg);box-shadow:0 0 45px #ffdd73;margin:25px auto;animation:pop .6s}.finalimg{animation:reveal 1.3s ease-out}.spark{position:fixed;width:9px;height:9px;background:#ffe492;box-shadow:0 0 12px #ffe492;border-radius:50%;pointer-events:none;z-index:10;animation:fall 2s linear forwards}@keyframes fall{from{top:-10px;opacity:1}to{top:105vh;opacity:0;transform:translateX(35px)}}@keyframes pop{0%{scale:.4}80%{scale:1.15}100%{scale:1}}@keyframes glow{from{box-shadow:0 0 4px #d9bc65}to{box-shadow:0 0 32px #ffe68b}}@keyframes reveal{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}@media(max-width:680px){.intro{grid-template-columns:1fr}.rolecards{grid-template-columns:1fr}.controls{gap:4px}button.small{font-size:12px;padding:7px}.book img{height:110px}.tile{width:88px}.tile img{height:90px}.slot{width:88px}.splash img{max-height:55vh}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.spoken-text{max-width:1100px;margin:10px auto;text-align:center;font-size:clamp(17px,2vw,23px);line-height:1.4;color:#ffe9b2;min-height:0}.spoken-text:empty{display:none}.dialogue-deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px auto}.dialogue-card{display:flex;align-items:center;gap:10px;background:#194e58;color:#fff5da;border:1px solid #e9c87e;border-radius:14px;padding:10px;text-align:left;font-size:18px}.dialogue-card img{width:28%;max-width:96px;border-radius:8px}.dialogue-card strong{display:block;color:#ffe4a0;margin-bottom:4px}.speech-task{padding:12px;border:1px solid #d8b66b;border-radius:12px;text-align:center;max-width:1000px;margin:12px auto;background:#19535b}#audio-studio{max-width:1080px;margin:auto}#audio-studio[hidden],main[hidden]{display:none}.audio-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.audio-item{background:#164651;border:1px solid #d0b270;border-radius:10px;padding:12px}.audio-item p{line-height:1.5}.audio-item b{color:#ffe4a0}.upload-label{display:inline-block;font-size:14px;border:1px solid #d6b15b;border-radius:8px;padding:7px;cursor:pointer}.upload-label input{display:none}.audio-item small{display:block;margin-top:8px;color:#e8d8b4}@media(max-width:680px){.dialogue-deck,.audio-list{grid-template-columns:1fr}}</style></head><body><div id="app"><header><div class="brand">Ожившее слово · Тайна перепутанных сказок</div><div class="progress" id="progress" aria-label="Прогресс"></div><div class="controls"><button class="small" id="studio">Озвучка</button><button class="small" id="voice">Повторить голос</button><button class="small" id="mute">Звук: вкл.</button><button class="small" id="full">На весь экран</button><button class="small" id="restart">В начало</button></div></header><div id="spoken-text" role="status" class="spoken-text"></div><main id="main"></main><section id="audio-studio" hidden></section></div><script type="application/json" id="embedded-audio">{}</script><script>
const A={"six":"images/six.jpg","five":"images/five.jpg","four":"images/four.jpg","home":"images/home.webp","fairy":"images/fairy.webp","end":"images/end.webp","repka":"images/repka.webp","kolobok":"images/kolobok.webp","plant":"images/plant.webp","grow":"images/grow.webp","alone":"images/alone.webp","two":"images/two.webp","three":"images/three.webp","bake":"images/bake.webp","escape":"images/escape.webp","hareScene":"images/hareScene.webp","wolfScene":"images/wolfScene.webp","bearScene":"images/bearScene.webp","foxScene":"images/foxScene.webp","ded":"images/ded.webp","babka":"images/babka.webp","girl":"images/girl.webp","dog":"images/dog.webp","cat":"images/cat.webp","mouse":"images/mouse.webp","bun":"images/bun.webp","hare":"images/hare.webp","wolf":"images/wolf.webp","bear":"images/bear.webp","fox":"images/fox.webp","turnip":"images/turnip.webp"};const N={ded:'Дедушка',babka:'Бабушка',girl:'Внучка',dog:'Жучка',cat:'Кошка',mouse:'Мышка',bun:'Колобок',hare:'Заяц',wolf:'Волк',bear:'Медведь',fox:'Лиса',plant:'Посадил репку',grow:'Выросла репка',alone:'Дед тянет репку',two:'Позвал бабушку',three:'Позвали внучку',four:'Внучка позвала Жучку',five:'Жучка позвала кошку',six:'Кошка позвала мышку',turnip:'Репка',repka:'Все вместе вытянули репку',bake:'Испекли Колобка',escape:'Укатился',hareScene:'Встретил зайца',wolfScene:'Встретил волка',bearScene:'Встретил медведя',foxScene:'Встретил лису'};const $=id=>document.getElementById(id), main=$('main');let view='home',level=0,mode='demo',done=[],selected=null,assigned={},placed=[],stage=0,err=0,corrected=false,spoken=false,story='repka',last='',sound=true,shuffled=[],finished=false;const levels=['Верни героя в сказку','Машина сказочного времени','Сказочный детектив','Живая математика','Сказочный режиссёр'];const img=(id,alt='')=>`<img src="${A[id]}" alt="${alt||N[id]||''}" draggable="false">`;const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const L={"intro": {"text": "Ребята! В волшебной библиотеке перепутались две сказки. Поможете вернуть героев домой?", "voice": "Волшебница"}, "level_1": {"text": "Выбери героя и коснись его книги. Объясни свой выбор.", "voice": "Волшебница"}, "level_2": {"text": "Собери кадры сказки по порядку. Расскажи, что было сначала, а что потом.", "voice": "Волшебница"}, "level_3": {"text": "Посмотри на картинку. Волшебница перепутала события. Найди ошибку и объясни.", "voice": "Волшебница"}, "level_4": {"text": "Пригласи героев в правильном порядке. Назови, кто за кем пришёл.", "voice": "Волшебница"}, "level_5": {"text": "Распределите роли, договоритесь и оживите сказку своими голосами.", "voice": "Волшебница"}, "select": {"text": "Сначала выбери героя.", "voice": "Волшебница"}, "sort_hint": {"text": "Вспомни, в какой сказке жил этот герой и что он делал.", "voice": "Волшебница"}, "place_hint": {"text": "Выбери картинку, затем свободное место.", "voice": "Волшебница"}, "seq_hint": {"text": "Подумай, какое событие было раньше, а какое позже.", "voice": "Волшебница"}, "math_hint": {"text": "Посмотри, кто уже стоит в цепочке. Кто должен быть следующим?", "voice": "Волшебница"}, "detect_hint": {"text": "Рассмотри рисунок и вспомни сказку.", "voice": "Волшебница"}, "sort_done": {"text": "Все герои дома! Назовите двух героев и объясните, что они делали.", "voice": "Волшебница"}, "seq_done": {"text": "Теперь расскажите сказку: сначала, потом, наконец.", "voice": "Волшебница"}, "math_done": {"text": "Посчитайте героев. Кто пришёл третьим? Кто последний?", "voice": "Волшебница"}, "transition_seq": {"text": "Мы восстановили события сказки про репку. Теперь разложим картинки сказки про Колобка.", "voice": "Волшебница"}, "transition_math": {"text": "Репку тянули шесть героев. Теперь посчитаем, сколько зверей встретил Колобок.", "voice": "Волшебница"}, "reflect": {"text": "Какой приём побуждал вас объяснять, слушать собеседника и договариваться?", "voice": "Волшебница"}, "final": {"text": "Вы вернули героям сказки и подарили им живые голоса. Каждое слово оживает, когда его произносят, слышат и понимают!", "voice": "Волшебница"}, "welcome": {"text": "Начнём сказочное приключение?", "voice": "Волшебница"}, "reward_1": {"text": "Ты помог героям вернуться в свои сказки. Первая искра зажглась!", "voice": "Волшебница"}, "reward_2": {"text": "Теперь события снова на своих местах. Вторая искра наша!", "voice": "Волшебница"}, "reward_3": {"text": "Ты исправил ошибки и объяснил, как было на самом деле. Третья искра засияла!", "voice": "Волшебница"}, "reward_4": {"text": "Ты восстановил порядок героев и посчитал их. Четвёртая искра найдена!", "voice": "Волшебница"}, "reward_5": {"text": "Герои снова разговаривают и понимают друг друга. Все пять искр собраны!", "voice": "Волшебница"}, "sort_ded_repka": {"text": "Дедушка посадил репку. Кого он позвал на помощь?", "voice": "Волшебница"}, "sort_ded_kolobok": {"text": "Дедушка попросил бабушку испечь Колобка. Ты правильно вспомнил сказку.", "voice": "Волшебница"}, "sort_babka_repka": {"text": "Бабушка помогает дедушке тянуть репку. Кого они позвали дальше?", "voice": "Волшебница"}, "sort_babka_kolobok": {"text": "Именно бабушка испекла Колобка. Куда она положила его остывать?", "voice": "Волшебница"}, "sort_girl": {"text": "Внучка пришла помогать бабушке. Кого она позвала?", "voice": "Волшебница"}, "sort_dog": {"text": "Жучка помогала тянуть репку. За кем она встала?", "voice": "Волшебница"}, "sort_cat": {"text": "Кошка пришла на помощь Жучке. Кого позвала кошка?", "voice": "Волшебница"}, "sort_mouse": {"text": "Даже маленькая мышка помогла вытянуть большую репку. Вместе они справились!", "voice": "Волшебница"}, "sort_bun": {"text": "Колобок нашёл свою сказку! Почему он укатился из дома?", "voice": "Волшебница"}, "sort_hare": {"text": "Заяц первым встретил Колобка. Что Колобок ему спел?", "voice": "Волшебница"}, "sort_wolf": {"text": "Волк встретился Колобку после зайца. Кто был следующим?", "voice": "Волшебница"}, "sort_bear": {"text": "Медведь встретился Колобку после волка. Кто встретился дальше?", "voice": "Волшебница"}, "sort_fox": {"text": "Лиса была последней, кого встретил Колобок. Как она его перехитрила?", "voice": "Волшебница"}, "seq_plant": {"text": "Сначала дедушка посадил репку. Что нужно растению, чтобы вырасти?", "voice": "Волшебница"}, "seq_grow": {"text": "Репка выросла большая-пребольшая. Что дедушка сделал потом?", "voice": "Волшебница"}, "seq_alone": {"text": "Дедушка попробовал вытянуть репку сам, но не смог. Что же делать?", "voice": "Волшебница"}, "seq_two": {"text": "Дедушка позвал бабушку. Вместе они стали тянуть репку.", "voice": "Волшебница"}, "seq_three": {"text": "Бабушка позвала внучку. Почему им нужны ещё помощники?", "voice": "Волшебница"}, "seq_four": {"text": "Внучка позвала Жучку. Теперь репку тянут четверо.", "voice": "Волшебница"}, "seq_five": {"text": "Жучка позвала кошку. Кого ещё можно позвать?", "voice": "Волшебница"}, "seq_six": {"text": "Кошка позвала мышку. Как ты думаешь, удастся ли им вытянуть репку?", "voice": "Волшебница"}, "seq_repka": {"text": "Все герои действовали вместе, поэтому смогли вытянуть репку.", "voice": "Волшебница"}, "seq_bake": {"text": "Сначала бабушка испекла Колобка. Так началась его история.", "voice": "Волшебница"}, "seq_escape": {"text": "Колобок укатился с окошка. Теперь его ждут встречи в лесу.", "voice": "Волшебница"}, "seq_hareScene": {"text": "Первым на лесной дорожке появился заяц. Кто встретился дальше?", "voice": "Волшебница"}, "seq_wolfScene": {"text": "После зайца Колобок встретил волка. Вспомни следующего героя.", "voice": "Волшебница"}, "seq_bearScene": {"text": "Затем появился медведь. Кого Колобок встретил последним?", "voice": "Волшебница"}, "seq_foxScene": {"text": "Последней Колобок встретил лису. Расскажи, чем закончилась сказка.", "voice": "Волшебница"}, "math_ded": {"text": "Дедушка пришёл первым. Именно он начал тянуть репку.", "voice": "Волшебница"}, "math_babka": {"text": "Бабушка вторая. Она const scenes=[{pic:'repka',title:'Репка и неожиданный помощник',s:'Колобок прикатился в огород. У него нет рук, но он очень хочет помочь.',roles:['Дедушка: попроси о помощи.','Колобок: предложи свой способ.','Мышка: договорись, как действовать вместе.']},{pic:'foxScene',title:'Колобок и новая встреча',s:'Лиса хочет услышать песенку, а Колобок хочет домой. Как им договориться?',roles:['Колобок: объясни, чего хочешь.','Лиса: предложи добрый вариант.','Заяц: помоги героям договориться.']},{pic:'hareScene',title:'Волшебный телефон',s:'Колобок нашёл волшебный телефон. Кому он позвонит и что попросит?',roles:['Колобок: начни разговор.','Заяц: ответь и задай вопрос.','Лиса: предложи решение.']}];let sceneIndex=0;function render(){progress();if(view==='home'){main.innerHTML=`<div class="splash">${img('home','Тайна перепутанных сказок')}</div><div class="homebuttons">${btn('demo','Начать мастер-класс')}${btn('long','Полная игра','secondary')}</div><p class="sub">5 испытаний · 2 сказки · 1 живой театр</p>`;$('demo').onclick=()=>start('demo');$('long').onclick=()=>start('full');return}if(view==='intro'){main.innerHTML=`<div class="intro">${img('fairy')}<div><h2>Волшебница сказок</h2><p>«Ребята стали забывать сказки. Все страницы перепутались, а герои потеряли свои голоса. Помогите вернуть волшебство!»</p>${btn('next','Поможем героям!')}</div></div>`;$('next').onclick=()=>init(1);return}if(view==='reward'){main.innerHTML=`<div class="reward">${img(level===5?'end':'fairy')}<div class="biggem"></div><h2>Испытание ${level} пройдено!</h2><p class="sub">Волшебство возвращается: ${done.length} из 5</p>${btn('next',level===5?'Открыть волшебную книгу':'Следующее испытание')}</div>`;$('next').onclick=()=>level===5?finish():init(level+1);return}if(view==='final'){main.innerHTML=`<h1>Сказки ожили!</h1><div class="splash finalimg shine">${img('end')}</div><p class="sub">Каждое слово оживает, когда его произносят, слышат и понимают.</p>${actions(btn('again','Играть снова')+btn('reflect','Обсудить с группой','secondary'))}<div id="feedback" class="feedback">Что помогло героям: правильный ответ или разговор и совместные действия?</div>`;$('again').onclick=()=>{stopVoice();view='home';done=[];render()};$('reflect').onclick=()=>explain('reflect','');return}if(level===1){const count=b=>Object.values(assigned).filter(x=>x===b).length;main.innerHTML=heading(1,'Выбери героя и верни его в свою книгу.')+`<div class="books">${['repka','kolobok'].map(b=>`<button class="book" data-book="${b}">${img(b)}<strong>${b==='repka'?'Репка':'Колобок'}</strong><span class="count">${count(b)}</span></button>`).join('')}</div><div class="deck">${shuffled.filter(k=>!assigned[k]).map(card).join('')}</div>`+feedback(`Вернулись: ${Object.keys(assigned).length} из ${shuffled.length}`)+actions(`<button id="confirm" class="primary" ${Object.keys(assigned).length!==shuffled.length?'disabled':''}>Рассказали — дальше</button>`)+teacher('Попросите ребёнка обосновать выбор. Дедушка и бабушка встречаются в обеих сказках. В демонстрации распределите героев между двумя группами; третья группа объясняет выбор.');wireCards(select);main.querySelectorAll('[data-book]').forEach(el=>drop(el,()=>sortTo(el.dataset.book)));$('confirm').onclick=reward;return}if(level===2||level===4){let target=arr();let complete=placed.length===target.length;if(!shuffled.length||shuffled.some(k=>!target.includes(k)))shuffled=shuffle(target);main.innerHTML=heading(level,(stage===0?'Репка: ':'Колобок: ')+(level===2?'восстанови все события.':'кто за кем пришёл?'))+`<div class="slots">${target.map((_,i)=>`<button class="slot" data-slot="${i}" aria-label="Место ${i+1}"><b>${i+1}</b>${placed[i]?img(placed[i]):'<span>Место для картинки</span>'}</button>`).join('')}</div><div class="deck">${shuffled.filter(k=>!placed.includes(k)).map(card).join('')}</div>`+(complete?'<div class="speech-task">'+(level===2?(stage===0?'Почему дедушка не справился один? Расскажи сказку по порядку.':'Кого Колобок встретил первым и последним? Расскажи сказку.'):(stage===0?'Кто третий и кто шестой? Сколько героев тянули репку?':'Кто второй и кто четвёртый? На сколько меньше зверей встретил Колобок?'))+'</div>':'')+feedback(placed.length===target.length?'Расскажите и объясните.':level===2?'Сначала выбери кадр, затем место.':'Назови, кто идёт первым.')+actions(`<button id="confirm" class="primary" ${placed.length!==target.length?'disabled':''}>${level===2?'Рассказали — дальше':'Посчитали — дальше'}</button>`)+teacher(level===2?'Речевые опоры: сначала, потом, после этого, наконец. Затем восстановите события «Колобка».':'Попросите назвать третий и последний порядковые номера, посчитать всех. Затем сравните количество героев двух сказок.');wireCards(sequencePick);main.querySelectorAll('[data-slot]').forEach(el=>drop(el,()=>put(Number(el.dataset.slot))));$('confirm').onclick=()=>{if(stage===0){stage=1;placed=[];selected=null;shuffled=[];render();say(level===2?'transition_seq':'transition_math')}else reward()};return}if(level===3){let q=errors[err];main.innerHTML=heading(3,corrected?'Ошибка исправлена!':q.line)+`<div class="scene">${img(corrected?q.after:q.scene)}</div><p class="sub">${corrected?q.fix:q.prompt}</p>`+(corrected?'':`<div class="choices">${q.opts.map(k=>`<button class="choice" data-choice="${k}">${img(k)}${N[k]||'Репка'}</button>`).join('')}</div>`)+feedback(corrected?'Объясните, почему прежнее утверждение неверно.':'Выбери верный вариант и объясни.')+actions(`<button class="primary" id="confirm" ${!corrected?'disabled':''}>Объяснили — дальше</button>`)+teacher('Важно: это не поиск скрытого предмета, а исправление ошибочного утверждения по иллюстрации. Дайте ребёнку сформулировать правильное предложение до перехода дальше.');main.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>answer(el.dataset.choice));$('confirm').onclick=()=>{if(err+1<(errors.length)){err++;corrected=false;render();say('question_'+err)}else reward()};return}if(level===5){const s=scenes[sceneIndex];main.innerHTML=heading(5,'Придумайте диалог и озвучьте героев вживую.')+`<div class="stage">${img(s.pic)}</div><h2 style="text-align:center">${s.title}</h2><p class="sub">${s.s}</p><div class="rolecards">${s.roles.map((r,i)=>`<div class="role"><strong>Группа ${i+1}</strong>${r}</div>`).join('')}</div>`+`<div class="dialogue-deck">${dialogues[sceneIndex].map(([k,v,t],i)=>`<button class="dialogue-card" data-actor="${i}">${img(k)}<span><strong>${v}</strong>${t}</span></button>`).join('')}</div>`+actions(btn('confirm',sceneIndex===0?'Сыграли «Репку» — к Колобку':sceneIndex===1&&mode==='full'?'Сыграли — ещё одна сценка':'Сыграли сценку — завершить'))+teacher('Дайте трём группам 30–45 секунд на обсуждение. По одному представителю от каждой группы разыгрывают диалог с пальчиковыми фигурками или без реквизита. Педагог подтверждает завершение.');main.querySelectorAll('[data-actor]').forEach(e=>e.onclick=()=>say('dialog_'+sceneIndex+'_'+e.dataset.actor));$('confirm').onclick=()=>{if(sceneIndex===0||(mode==='full'&&sceneIndex===1)){sceneIndex++;render();say('scene_'+sceneIndex)}else reward()};return}}

function downloadFile(name,data,type){let u=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function updateStudio(){const el=$('audio-studio');el.innerHTML=`<h2>Подготовка озвучки</h2><p>Загрузите готовые записи MP3 или WAV. Роботизированный голос отключён полностью. Без записи игра показывает текст и остаётся рабочей.</p><p>Записей загружено: <strong id="audio-count">${Object.keys(audioFiles).length} из ${Object.keys(L).length}</strong></p><div class="actions"><button class="secondary" id="close-studio">Вернуться в игру</button><button class="secondary" id="save-texts">Скачать тексты реплик</button><button class="secondary" id="save-game">Сохранить игру с аудио</button></div><p>Пакетная загрузка: назовите файлы по кодам в списке, например intro.mp3. Можно выбрать сразу несколько файлов.</p><input type="file" id="bulk-audio" accept="audio/*,.mp3,.wav,.m4a,.ogg,.webm" multiple><div class="audio-list">${Object.entries(L).map(([k,v])=>`<article class="audio-item"><b>${k} · ${v.voice}</b><p>${v.text}</p><div><button class="small" data-copy="${k}">Копировать текст</button> <label class="upload-label">Загрузить аудио <input type="file" data-upload="${k}" accept="audio/*,.mp3,.wav,.m4a,.ogg,.webm"></label> <button class="small" data-preview="${k}" ${audioFiles[k]?'':'disabled'}>Прослушать</button> <button class="small" data-delete="${k}" ${audioFiles[k]?'':'disabled'}>Удалить</button></div><small>${audioFiles[k]?'Запись добавлена':'Нет записи'}</small></article>`).join('')}</div>`;
$('close-studio').onclick=()=>{stopVoice();el.hidden=true;main.hidden=false;};$('save-texts').onclick=()=>downloadFile('Реплики_для_озвучки.txt',Object.entries(L).map(([k,v])=>k+' | '+v.voice+'\n'+v.text).join('\n\n'),'text/plain;charset=utf-8');$('save-game').onclick=()=>{stopVoice();let copy=document.documentElement.cloneNode(true);copy.querySelector('#embedded-audio').textContent=JSON.stringify(audioFiles);copy.querySelector('#audio-studio').innerHTML='';copy.querySelector('#audio-studio').hidden=true;copy.querySelector('#main').innerHTML='';copy.querySelector('#main').hidden=false;copy.querySelector('#spoken-text').textContent='';copy.querySelector('#mute').textContent='Звук: вкл.';downloadFile('Сказки_с_озвучкой.html','<!DOCTYPE html>\n'+copy.outerHTML,'text/html;charset=utf-8');};
const read=(file,k)=>new Promise((res,rej)=>{if(!file||!L[k])return res(false);let r=new FileReader();r.onload=()=>{audioFiles[k]=r.result;res(true)};r.onerror=rej;r.readAsDataURL(file)});$('bulk-audio').onchange=async e=>{let files=[...e.target.files];let count=0;for(let f of files){let k=f.name.replace(/\.[^.]+$/,'');if(await read(f,k))count++}updateStudio();if(count<files.length)alert('Добавлено '+count+' из '+files.length+'. Проверьте имена остальных файлов.');};el.querySelectorAll('[data-upload]').forEach(e=>e.onchange=async()=>{await read(e.files[0],e.dataset.upload);updateStudio()});el.querySelectorAll('[data-copy]').forEach(e=>e.onclick=async()=>{try{await navigator.clipboard.writeText(L[e.dataset.copy].text);e.textContent='Скопировано'}catch{let t=document.createElement('textarea');t.value=L[e.dataset.copy].text;document.body.append(t);t.select();document.execCommand('copy');t.remove();e.textContent='Скопировано'}});el.querySelectorAll('[data-preview]').forEach(e=>e.onclick=()=>{stopVoice();currentAudio=new Audio(audioFiles[e.dataset.preview]);currentAudio.play().catch(()=>alert('Не удалось воспроизвести запись.'))});el.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{stopVoice();delete audioFiles[e.dataset.delete];updateStudio()});}
$('studio').onclick=()=>{stopVoice();main.hidden=true;$('audio-studio').hidden=false;updateStudio()};
$('voice').onclick=()=>say(lastKey);$('mute').onclick=()=>{sound=!sound;$('mute').textContent='Звук: '+(sound?'вкл.':'выкл.');if(!sound)stopVoice()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('Полноэкранный режим недоступен в этом браузере.')}};$('restart').onclick=()=>{stopVoice();$('audio-studio').hidden=true;main.hidden=false;$('spoken-text').textContent='';view='home';done=[];render()};render();
</script></body></html>
